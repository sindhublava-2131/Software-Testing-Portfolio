name: Full-Stack Quality & Test Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Execute Vitest, Playwright E2E & Security Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: 05_Test_Automation/package-lock.json

      - name: Install SUT Dependencies
        run: |
          if [ -d ".sut" ]; then
            cd .sut/server && npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            cd ../client && npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          fi

      - name: Install Test Automation Harness Dependencies
        working-directory: 05_Test_Automation
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        working-directory: 05_Test_Automation
        run: npx playwright install --with-deps chromium

      - name: Run Vitest Unit, API, Socket & Security Test Suites
        working-directory: 05_Test_Automation
        run: npm run test:all-api || true

      - name: Run Playwright E2E UI Tests
        working-directory: 05_Test_Automation
        run: npx playwright test || true

      - name: Execute Link & Architecture Crawler
        working-directory: 05_Test_Automation
        run: npm run test:links

      - name: Rebuild Markdown Test & Defect Reports
        working-directory: 05_Test_Automation
        run: node scripts/build_reports.mjs

      - name: Upload Test Execution Reports & Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-artifacts
          path: |
            03_Test_Execution/
            04_Defect_Reports/
            06_Test_Reports/
            07_Screenshots/
          retention-days: 14
